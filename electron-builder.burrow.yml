# Burrow: den v2 (the Manager pane), built from this repo with
# `npm run pack` (Den is `npm run pack:den`). Its own app id, name, and icon so it installs next to
# Den; its own data in ~/.burrow (server/edition.ts).
extends: electron-builder.yml
appId: io.den.burrow
productName: Burrow
directories:
  output: release-burrow
  buildResources: build
mac:
  icon: build/burrow.icns
