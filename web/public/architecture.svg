<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b9a8c9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" rx="18" fill="#2b2233"/>

  <!-- ======================= Electron app ======================= -->
  <rect x="40" y="34" width="1320" height="304" rx="14" fill="none" stroke="#4a3c58" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="64" y="66" font-size="19" font-weight="bold" fill="#f3e9f7">Electron app (Den.app)</text>
  <text x="330" y="66" font-size="14" fill="#b9a8c9">— everything in one process family, nothing exposed to the network</text>

  <!-- renderer -->
  <rect x="64" y="86" width="770" height="228" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="84" y="116" font-size="16" font-weight="bold" fill="#ffb2d8">renderer — React + xterm.js</text>
  <text x="84" y="138" font-size="13" fill="#b9a8c9">BrowserWindow: sandbox, contextIsolation, no Node integration</text>

  <rect x="84" y="156" width="360" height="60" rx="9" fill="#2b2233" stroke="#ffb2d8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="102" y="181" font-size="14" font-weight="bold" fill="#f3e9f7">App.tsx</text>
  <text x="102" y="201" font-size="12.5" fill="#b9a8c9">composition root: layout, views, dialogs</text>

  <rect x="458" y="156" width="356" height="60" rx="9" fill="#2b2233" stroke="#f7e79c" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="476" y="181" font-size="14" font-weight="bold" fill="#f3e9f7">useSessions</text>
  <text x="476" y="201" font-size="12.5" fill="#b9a8c9">session list + mutations · 4s merge poll</text>

  <rect x="84" y="230" width="360" height="60" rx="9" fill="#2b2233" stroke="#a5e6c4" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="102" y="255" font-size="14" font-weight="bold" fill="#f3e9f7">WorkDataProvider</text>
  <text x="102" y="275" font-size="12.5" fill="#b9a8c9">one 60s poll for GitHub PRs + Linear issues</text>

  <rect x="458" y="230" width="356" height="60" rx="9" fill="#2b2233" stroke="#a2dfe8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="476" y="255" font-size="14" font-weight="bold" fill="#f3e9f7">TerminalView / useTerminal</text>
  <text x="476" y="275" font-size="12.5" fill="#b9a8c9">xterm.js pane, replays scrollback on attach</text>

  <!-- main process -->
  <rect x="866" y="86" width="470" height="228" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="886" y="116" font-size="16" font-weight="bold" fill="#ffcaa3">main process — electron/main.ts</text>
  <text x="886" y="150" font-size="13.5" fill="#f3e9f7">· fixPath(): pulls the login-shell PATH so a</text>
  <text x="898" y="170" font-size="13.5" fill="#f3e9f7">double-clicked app finds claude / gh</text>
  <text x="886" y="196" font-size="13.5" fill="#f3e9f7">· trimmed macOS menu (frees Cmd+W)</text>
  <text x="886" y="222" font-size="13.5" fill="#f3e9f7">· runs startServer() in-process</text>
  <text x="886" y="254" font-size="13" fill="#b9a8c9">headless alternative: the CLI entry</text>
  <text x="886" y="274" font-size="13" fill="#b9a8c9">server/index.ts runs the same server</text>

  <!-- arrows into the server -->
  <line x1="264" y1="314" x2="264" y2="398" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="356" font-size="13.5" fill="#f3e9f7">REST /api/*</text>
  <text x="280" y="376" font-size="12.5" fill="#b9a8c9">sessions · fs · github · linear · notepad</text>

  <line x1="636" y1="314" x2="636" y2="398" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="646" y1="398" x2="646" y2="314" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664" y="356" font-size="13.5" fill="#f3e9f7">WS /ws/terminal</text>
  <text x="664" y="376" font-size="12.5" fill="#b9a8c9">keystrokes down, terminal bytes up</text>

  <line x1="1101" y1="314" x2="1101" y2="398" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1117" y="362" font-size="13" fill="#b9a8c9">starts (same process)</text>

  <!-- ======================= server ======================= -->
  <rect x="40" y="400" width="1320" height="352" rx="14" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="64" y="432" font-size="19" font-weight="bold" fill="#f3e9f7">server/app.ts — Fastify, loopback only (127.0.0.1)</text>

  <rect x="64" y="450" width="1272" height="46" rx="9" fill="#2b2233" stroke="#ffb2d8" stroke-width="1.5"/>
  <text x="82" y="479" font-size="13.5" fill="#f3e9f7"><tspan font-weight="bold" fill="#ffb2d8">security.ts</tspan> — every request, REST and the WS upgrade: Host must be loopback (blocks DNS rebinding); Origin, when present, must be loopback (blocks CSWSH)</text>

  <!-- module chips, row 1 -->
  <rect x="64" y="516" width="450" height="88" rx="9" fill="#2b2233" stroke="#bcb8f6" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="82" y="542" font-size="14" font-weight="bold" fill="#f3e9f7">sessions.ts — SessionManager</text>
  <text x="82" y="562" font-size="12.5" fill="#b9a8c9">long-lived DenSession PTYs · 256KB scrollback ring</text>
  <text x="82" y="580" font-size="12.5" fill="#b9a8c9">OSC titles · attention bell · review-pane guardrails</text>

  <rect x="534" y="516" width="260" height="88" rx="9" fill="#2b2233" stroke="#c9e9a0" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="552" y="542" font-size="14" font-weight="bold" fill="#f3e9f7">github.ts</text>
  <text x="552" y="562" font-size="12.5" fill="#b9a8c9">PR buckets + attention rules</text>
  <text x="552" y="580" font-size="12.5" fill="#b9a8c9">CI from `gh pr checks`</text>

  <rect x="814" y="516" width="260" height="88" rx="9" fill="#2b2233" stroke="#a2dfe8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="832" y="542" font-size="14" font-weight="bold" fill="#f3e9f7">linear.ts</text>
  <text x="832" y="562" font-size="12.5" fill="#b9a8c9">assigned issues + comments</text>
  <text x="832" y="580" font-size="12.5" fill="#b9a8c9">unread-notification count</text>

  <rect x="1094" y="516" width="242" height="88" rx="9" fill="#2b2233" stroke="#ffcaa3" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1112" y="542" font-size="14" font-weight="bold" fill="#f3e9f7">git.ts</text>
  <text x="1112" y="562" font-size="12.5" fill="#b9a8c9">ticket branches, worktrees,</text>
  <text x="1112" y="580" font-size="12.5" fill="#b9a8c9">`gh pr checkout`</text>

  <!-- module chips, row 2 -->
  <rect x="64" y="622" width="300" height="88" rx="9" fill="#2b2233" stroke="#d7b3f4" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="82" y="648" font-size="14" font-weight="bold" fill="#f3e9f7">store.ts</text>
  <text x="82" y="668" font-size="12.5" fill="#b9a8c9">better-sqlite3: session rows,</text>
  <text x="82" y="686" font-size="12.5" fill="#b9a8c9">scrollback tails, settings</text>

  <rect x="384" y="622" width="300" height="88" rx="9" fill="#2b2233" stroke="#f7e79c" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="402" y="648" font-size="14" font-weight="bold" fill="#f3e9f7">fs.ts</text>
  <text x="402" y="668" font-size="12.5" fill="#b9a8c9">folder browsing, realpath-</text>
  <text x="402" y="686" font-size="12.5" fill="#b9a8c9">sandboxed to $HOME</text>

  <rect x="704" y="622" width="300" height="88" rx="9" fill="#2b2233" stroke="#a5e6c4" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="722" y="648" font-size="14" font-weight="bold" fill="#f3e9f7">discover.ts</text>
  <text x="722" y="668" font-size="12.5" fill="#b9a8c9">past Claude sessions from</text>
  <text x="722" y="686" font-size="12.5" fill="#b9a8c9">transcripts, for resume</text>

  <rect x="1024" y="622" width="312" height="88" rx="9" fill="#2b2233" stroke="#abc9f6" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1042" y="648" font-size="14" font-weight="bold" fill="#f3e9f7">notepads + review files</text>
  <text x="1042" y="668" font-size="12.5" fill="#b9a8c9">progress log per workspace,</text>
  <text x="1042" y="686" font-size="12.5" fill="#b9a8c9">PR diff, reading guide, settings</text>

  <!-- arrows to the world -->
  <line x1="200" y1="752" x2="200" y2="822" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="214" y="792" font-size="12.5" fill="#b9a8c9">spawns</text>
  <line x1="475" y1="752" x2="475" y2="822" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="752" x2="700" y2="822" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="714" y="792" font-size="12.5" fill="#b9a8c9">authed gh CLI</text>
  <line x1="935" y1="752" x2="935" y2="822" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="949" y="792" font-size="12.5" fill="#b9a8c9">GraphQL</text>
  <line x1="1130" y1="752" x2="1130" y2="822" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1300" y1="752" x2="1300" y2="822" stroke="#b9a8c9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ======================= the world ======================= -->
  <rect x="64" y="824" width="272" height="118" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="82" y="852" font-size="14.5" font-weight="bold" fill="#bcb8f6">claude · zsh</text>
  <text x="82" y="874" font-size="12.5" fill="#b9a8c9">the PTY children — Claude Code</text>
  <text x="82" y="892" font-size="12.5" fill="#b9a8c9">panes and shell tabs, which run</text>
  <text x="82" y="910" font-size="12.5" fill="#b9a8c9">with your privileges</text>

  <rect x="356" y="824" width="238" height="118" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="374" y="852" font-size="14.5" font-weight="bold" fill="#d7b3f4">~/.den/</text>
  <text x="374" y="874" font-size="12.5" fill="#b9a8c9">den.db (sqlite, Linear key)</text>
  <text x="374" y="892" font-size="12.5" fill="#b9a8c9">progress/&lt;groupId&gt;.md</text>
  <text x="374" y="910" font-size="12.5" fill="#b9a8c9">review/&lt;groupId&gt;.diff</text>

  <rect x="614" y="824" width="238" height="118" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="632" y="852" font-size="14.5" font-weight="bold" fill="#c9e9a0">GitHub</text>
  <text x="632" y="874" font-size="12.5" fill="#b9a8c9">PRs, checks, review threads —</text>
  <text x="632" y="892" font-size="12.5" fill="#b9a8c9">always via the gh CLI,</text>
  <text x="632" y="910" font-size="12.5" fill="#b9a8c9">never a raw token</text>

  <rect x="872" y="824" width="190" height="118" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="890" y="852" font-size="14.5" font-weight="bold" fill="#a2dfe8">Linear API</text>
  <text x="890" y="874" font-size="12.5" fill="#b9a8c9">api.linear.app,</text>
  <text x="890" y="892" font-size="12.5" fill="#b9a8c9">key from settings or</text>
  <text x="890" y="910" font-size="12.5" fill="#b9a8c9">$LINEAR_API_KEY</text>

  <rect x="1082" y="824" width="118" height="118" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="1098" y="852" font-size="14.5" font-weight="bold" fill="#ffcaa3">work repo</text>
  <text x="1098" y="874" font-size="12.5" fill="#b9a8c9">branches +</text>
  <text x="1098" y="892" font-size="12.5" fill="#b9a8c9">.claude-</text>
  <text x="1098" y="910" font-size="12.5" fill="#b9a8c9">worktrees/</text>

  <rect x="1220" y="824" width="140" height="118" rx="12" fill="#352a40" stroke="#4a3c58" stroke-width="2"/>
  <text x="1236" y="852" font-size="14.5" font-weight="bold" fill="#a5e6c4">~/.claude/</text>
  <text x="1236" y="874" font-size="12.5" fill="#b9a8c9">projects/ —</text>
  <text x="1236" y="892" font-size="12.5" fill="#b9a8c9">transcripts</text>
  <text x="1236" y="910" font-size="12.5" fill="#b9a8c9">for resume</text>

  <text x="64" y="978" font-size="12.5" fill="#b9a8c9">sessions outlive any window: the server owns the PTYs, the renderer just attaches — close den and the rail (with scrollback) is restored from ~/.den/den.db on the next launch</text>
</svg>
